<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WalletAI</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f7f9fc;
            --surface: #ffffff;
            --text: #101828;
            --muted: #667085;
            --border: rgba(16, 24, 40, 0.12);
            --accent: #0a66c2;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #080b12;
                --surface: #101522;
                --text: #f8fafc;
                --muted: #aeb8c8;
                --border: rgba(255, 255, 255, 0.12);
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.5;
        }

        main {
            width: min(100%, 820px);
            margin: 0 auto;
            padding: 28px 18px 44px;
        }

        article {
            border: 1px solid var(--border);
            border-radius: 22px;
            background: var(--surface);
            padding: clamp(18px, 5vw, 34px);
            box-shadow: 0 18px 44px rgba(15, 23, 42, 0.08);
        }

        h1 {
            margin: 0;
            font-size: clamp(1.7rem, 8vw, 2.5rem);
            line-height: 1.05;
        }

        .subtitle,
        .meta,
        section p {
            color: var(--muted);
        }

        .subtitle {
            margin: 12px 0 16px;
            font-size: 1rem;
        }

        .meta {
            display: grid;
            gap: 4px;
            margin-bottom: 22px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        section {
            padding: 16px 0;
            border-top: 1px solid var(--border);
        }

        section h2 {
            margin: 0 0 8px;
            font-size: 1.05rem;
        }

        section p {
            margin: 0;
            white-space: pre-line;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 24px;
        }

        nav a {
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 16px;
            border-radius: 14px;
            border: 1px solid var(--border);
            color: var(--text);
            text-decoration: none;
            font-weight: 800;
        }

        nav a.primary {
            border-color: transparent;
            background: var(--accent);
            color: #fff;
        }
    </style>
</head>
<body>
    <main>
        <article>
            <h1 data-i18n="settings_privacy_title"></h1>
            <p class="subtitle" data-i18n="legal_privacy_subtitle"></p>
            <div class="meta">
                <span data-i18n="legal_effective_date"></span>
                <span data-i18n="legal_app_identity"></span>
            </div>

            <div id="sections"></div>

            <nav>
                <a class="primary" href="delete-account.html" id="delete-link" data-i18n="settings_delete_account_title"></a>
                <a href="terms.html" id="terms-link" data-i18n="settings_terms_title"></a>
            </nav>
        </article>
    </main>

    <script>
        const supported = new Set(["ar", "bn", "da", "de", "el", "en", "es", "es-MX", "fr", "fr-CA", "he", "hi", "id", "it", "ja", "ko", "nl", "no", "pl", "pt", "ru", "sv", "sw", "th", "tr", "vi", "zh"]);
        const sections = [
            ["legal_privacy_overview_heading", "legal_privacy_overview_text"],
            ["legal_privacy_data_heading", "legal_privacy_data_text"],
            ["legal_privacy_usage_heading", "legal_privacy_usage_text"],
            ["legal_privacy_ai_heading", "legal_privacy_ai_text"],
            ["legal_privacy_third_parties_heading", "legal_privacy_third_parties_text"],
            ["legal_privacy_ads_heading", "legal_privacy_ads_text"],
            ["legal_privacy_security_heading", "legal_privacy_security_text"],
            ["legal_privacy_retention_heading", "legal_privacy_retention_text"],
            ["legal_privacy_rights_heading", "legal_privacy_rights_text"],
            ["legal_privacy_deletion_heading", "legal_privacy_deletion_text"],
            ["legal_privacy_contact_heading", "legal_privacy_contact_text"]
        ];

        function normalizeLanguage(value) {
            const normalized = (value || "en").trim().replace("_", "-");
            const lower = normalized.toLowerCase();
            if (lower === "en-us") return "en";
            if (lower === "it-it") return "it";
            if (lower === "es-mx") return "es-MX";
            if (lower === "fr-ca") return "fr-CA";
            const neutral = lower.split("-")[0];
            return supported.has(normalized) ? normalized : neutral;
        }

        async function loadTranslations() {
            const requested = new URLSearchParams(window.location.search).get("lang") || navigator.language || "en";
            const primary = normalizeLanguage(requested);
            const neutral = primary.split("-")[0];
            const candidates = [...new Set([primary, neutral, "en"])].filter(code => supported.has(code));

            for (const code of candidates) {
                const paths = [`i18n/${code}.json`, `../i18n/${code}.json`];
                for (const path of paths) {
                    try {
                        const response = await fetch(path, { cache: "no-store" });
                        if (!response.ok) continue;
                        return { code, data: await response.json() };
                    } catch {
                        continue;
                    }
                }
            }

            return { code: "en", data: {} };
        }

        function applyTranslations(code, translations) {
            document.documentElement.lang = code;
            document.title = translations.settings_privacy_title || "WalletAI";

            document.querySelectorAll("[data-i18n]").forEach(element => {
                const key = element.getAttribute("data-i18n");
                element.textContent = translations[key] || "";
            });

            const container = document.getElementById("sections");
            sections.forEach(([headingKey, textKey]) => {
                const section = document.createElement("section");
                const heading = document.createElement("h2");
                const text = document.createElement("p");
                heading.textContent = translations[headingKey] || "";
                text.textContent = translations[textKey] || "";
                section.append(heading, text);
                container.append(section);
            });

            document.getElementById("delete-link").href = `delete-account.html?lang=${encodeURIComponent(code)}`;
            document.getElementById("terms-link").href = `terms.html?lang=${encodeURIComponent(code)}`;
        }

        loadTranslations().then(result => applyTranslations(result.code, result.data));
    </script>
</body>
</html>
