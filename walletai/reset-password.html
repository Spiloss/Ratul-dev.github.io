<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset password - WalletAI</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f7f9fc;
            --surface: #ffffff;
            --text: #101828;
            --muted: #667085;
            --border: rgba(16, 24, 40, 0.12);
            --accent: #0a66c2;
            --accent-hover: #084f98;
            --danger: #dc2626;
            --success: #059669;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #080b12;
                --surface: #101522;
                --text: #f8fafc;
                --muted: #aeb8c8;
                --border: rgba(255, 255, 255, 0.12);
                --accent-hover: #2b8ce8;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.5;
        }

        main {
            width: min(100%, 760px);
            margin: 0 auto;
            padding: 28px 18px 44px;
        }

        .panel {
            border: 1px solid var(--border);
            border-radius: 22px;
            background: var(--surface);
            padding: clamp(18px, 5vw, 34px);
            box-shadow: 0 18px 44px rgba(15, 23, 42, 0.08);
        }

        .eyebrow {
            margin: 0 0 8px;
            color: var(--accent);
            font-size: 0.78rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.6rem, 8vw, 2.4rem);
            line-height: 1.05;
        }

        .subtitle,
        .help {
            color: var(--muted);
        }

        .subtitle {
            margin: 12px 0 22px;
            font-size: 1rem;
        }

        form {
            display: grid;
            gap: 16px;
            padding-top: 18px;
            border-top: 1px solid var(--border);
        }

        label {
            display: grid;
            gap: 8px;
            font-weight: 800;
        }

        input {
            width: 100%;
            min-height: 48px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: transparent;
            color: var(--text);
            padding: 0 14px;
            font: inherit;
        }

        input:focus {
            outline: 2px solid color-mix(in srgb, var(--accent) 34%, transparent);
            border-color: var(--accent);
        }

        .actions {
            display: grid;
            gap: 12px;
            margin-top: 4px;
        }

        button,
        .button {
            display: inline-flex;
            min-height: 48px;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 800;
            font: inherit;
        }

        button {
            border: 0;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .button.secondary {
            border: 1px solid var(--border);
            color: var(--text);
        }

        .status {
            margin: 18px 0 0;
            padding: 14px 16px;
            border-radius: 16px;
            border: 1px solid var(--border);
            color: var(--muted);
            font-weight: 700;
        }

        .status.error {
            border-color: color-mix(in srgb, var(--danger) 40%, var(--border));
            color: var(--danger);
        }

        .status.success {
            border-color: color-mix(in srgb, var(--success) 40%, var(--border));
            color: var(--success);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <main>
        <article class="panel">
            <p class="eyebrow">WalletAI</p>
            <h1>Reset password</h1>
            <p class="subtitle">Inserisci una nuova password per il tuo account WalletAI. Il link di recupero e valido solo per un periodo limitato.</p>

            <form id="reset-form">
                <label>
                    Nuova password
                    <input id="new-password" type="password" autocomplete="new-password" minlength="8" required>
                </label>

                <label>
                    Conferma password
                    <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required>
                </label>

                <p class="help">La password deve contenere almeno 8 caratteri.</p>

                <div class="actions">
                    <button id="submit-button" type="submit" disabled>Aggiorna password</button>
                    <a class="button secondary" href="https://spiloss.github.io/Ratul-dev.github.io/walletai/">Torna a WalletAI</a>
                </div>
            </form>

            <div id="status" class="status">Verifico il link di recupero...</div>
        </article>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = "https://bbvrdzcphotwhmpbuave.supabase.co";
        const supabaseAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJidnJkemNwaG90d2htcGJ1YXZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk2MjU3NDUsImV4cCI6MjA4NTIwMTc0NX0.tFNE8YWvN0BXrJtI6QixF3HkkGR4SphQlqlXwv5PGfc";
        const client = supabase.createClient(supabaseUrl, supabaseAnonKey, {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true
            }
        });

        const form = document.getElementById("reset-form");
        const passwordInput = document.getElementById("new-password");
        const confirmInput = document.getElementById("confirm-password");
        const submitButton = document.getElementById("submit-button");
        const statusBox = document.getElementById("status");

        function setStatus(message, type = "") {
            statusBox.textContent = message;
            statusBox.className = `status ${type}`.trim();
        }

        function getRecoveryParams() {
            const query = new URLSearchParams(window.location.search);
            const hash = new URLSearchParams(window.location.hash.replace(/^#/, ""));

            return {
                accessToken: hash.get("access_token"),
                refreshToken: hash.get("refresh_token"),
                type: hash.get("type") || query.get("type"),
                error: hash.get("error") || query.get("error"),
                errorDescription: hash.get("error_description") || query.get("error_description"),
                code: query.get("code")
            };
        }

        async function establishRecoverySession() {
            const params = getRecoveryParams();

            if (params.error) {
                throw new Error(params.errorDescription || "Link di recupero non valido o scaduto.");
            }

            if (params.accessToken && params.refreshToken) {
                const { data, error } = await client.auth.setSession({
                    access_token: params.accessToken,
                    refresh_token: params.refreshToken
                });

                if (error || !data.session) {
                    throw new Error(error?.message || "Link di recupero non valido o scaduto.");
                }

                return data.session;
            }

            if (params.code) {
                const { data, error } = await client.auth.exchangeCodeForSession(params.code);
                if (error || !data.session) {
                    throw new Error(error?.message || "Link di recupero non valido o scaduto.");
                }

                return data.session;
            }

            throw new Error("Link di recupero mancante, non valido o scaduto. Richiedi un nuovo reset password dall'app.");
        }

        async function initialize() {
            try {
                await establishRecoverySession();
                submitButton.disabled = false;
                setStatus("Link verificato. Puoi scegliere una nuova password.");
                window.history.replaceState({}, document.title, window.location.pathname);
            } catch (error) {
                submitButton.disabled = true;
                setStatus(error.message || "Link di recupero non valido o scaduto.", "error");
            }
        }

        form.addEventListener("submit", async event => {
            event.preventDefault();

            const newPassword = passwordInput.value.trim();
            const confirmPassword = confirmInput.value.trim();

            if (!newPassword) {
                setStatus("Inserisci una nuova password.", "error");
                return;
            }

            if (newPassword.length < 8) {
                setStatus("La password deve contenere almeno 8 caratteri.", "error");
                return;
            }

            if (newPassword !== confirmPassword) {
                setStatus("Le password non coincidono.", "error");
                return;
            }

            submitButton.disabled = true;
            setStatus("Aggiorno la password...");

            const { error } = await client.auth.updateUser({ password: newPassword });

            if (error) {
                submitButton.disabled = false;
                setStatus(error.message || "Non e stato possibile aggiornare la password. Richiedi un nuovo link.", "error");
                return;
            }

            passwordInput.value = "";
            confirmInput.value = "";
            await client.auth.signOut();
            setStatus("Password aggiornata. Puoi tornare in WalletAI e accedere con la nuova password.", "success");
        });

        initialize();
    </script>
</body>
</html>
